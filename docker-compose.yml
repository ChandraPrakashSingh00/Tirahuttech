version: "3.9"

services:
  server:
    build: ./server
    container_name: tirahut-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build: ./client
    container_name: tirahut-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
